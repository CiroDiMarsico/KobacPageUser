version: '3.8'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: kobac_api:latest
    environment:
      PORT: 3000
      DB_HOST: ${DB_HOST}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - kobac_uploads:/app/public
    networks:
      - red_existente
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.kobac-api.rule=Host(`kobacdelivery.com`) && PathPrefix(`/api`)"
        - "traefik.http.routers.kobac-api.entrypoints=websecure"
        - "traefik.http.routers.kobac-api.tls=true"
        - "traefik.http.routers.kobac-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.kobac-api.priority=10"
        - "traefik.http.services.kobac-api.loadbalancer.server.port=3000"

  frontend:
    build:
      context: ./my-app
      dockerfile: Dockerfile
    image: kobac_frontend:latest
    depends_on:
      - api
    networks:
      - red_existente
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.kobac-web.rule=Host(`kobacdelivery.com`) || Host(`www.kobacdelivery.com`)"
        - "traefik.http.routers.kobac-web.entrypoints=websecure"
        - "traefik.http.routers.kobac-web.tls=true"
        - "traefik.http.routers.kobac-web.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.kobac-web.loadbalancer.server.port=80"

volumes:
  kobac_uploads:

networks:
  red_existente:
    external: true
    name: Kobacnet