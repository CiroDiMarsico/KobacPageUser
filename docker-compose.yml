version: '3.8'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: kobac_api:latest
    environment:
      PORT: 3000
      DB_HOST: ${DB_HOST}
      DB_USER: kobac_user
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - kobac_uploads:/app/public
    networks:
      - kobac_network

  frontend:
    build:
      context: ./my-app
      dockerfile: Dockerfile
    image: kobac_frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - kobac_network

volumes:
  kobac_uploads:

networks:
  kobac_network:
    external: false