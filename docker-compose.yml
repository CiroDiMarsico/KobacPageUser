version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - kobac_db_data:/var/lib/mysql
    networks:
      - kobac_network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: kobac_api:latest
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - kobac_uploads:/app/public
    depends_on:
      - db
    networks:
      - kobac_network

  frontend:
    build:
      context: ./my-app
      dockerfile: Dockerfile
    image: kobac_frontend:latest
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - kobac_network

volumes:
  kobac_db_data:
  kobac_uploads:

networks:
  kobac_network:
    driver: overlay
    attachable: true